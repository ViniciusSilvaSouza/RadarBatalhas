version: '3.8'
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: radar-api:dev
    container_name: radar-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=radar
      - DB_USER=radar
      - DB_PASSWORD=radar
      - REDIS_HOST=redis:6379
      - KEYCLOAK_AUTH_URL=http://keycloak:8080
      - KEYCLOAK_REALM=radar
      - KEYCLOAK_CLIENT_ID=radar-api
      - KEYCLOAK_CLIENT_SECRET=sYmkuFumaI1NVo6jpkvE7IoaX4fCjwtm
      - LOG_LEVEL=Information
    ports:
      - "5000:8080"
    depends_on:
      - mysql
      - redis
      - keycloak
  mysql:
    image: mysql:8.3
    container_name: radar-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: radar
      MYSQL_USER: radar
      MYSQL_PASSWORD: radar
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  redis:
    image: redis:7
    container_name: radar-redis
    ports:
      - "6379:6379"
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: radar-keycloak
    command: start-dev --http-port=8080
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
  adminer:
    image: adminer
    container_name: radar-adminer
    ports:
      - "8081:8080"
    depends_on:
      - mysql
  minio:
    image: minio/minio:RELEASE.2023-09-07T02-05-02Z
    container_name: radar-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
volumes:
  mysql_data:
  minio_data:
